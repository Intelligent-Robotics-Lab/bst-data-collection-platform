# Robotic Social Attributes Scale (RoSAS; Carpinella et al., 2017) -- TRAINER
# robot. 18 items, 7-point. Three subscales (Warmth, Competence, Discomfort),
# 6 items each.
#
# RESEARCH-INTEGRITY NOTE (CLAUDE.md + requirements.md): RoSAS items are single
# adjectives rated for how closely they are associated with the robot. The
# official adjectives are NOT reproduced here; each item carries a stable item_id
# and a neutral placeholder `text`. Drop the official adjective into each `text`
# to run the real instrument (config edit only, no code change). Subscale
# membership is factual metadata; the engine does not score (post hoc per PRD).
questionnaire_key: rosas_trainer
version: "1.0.0"
title: "RoSAS - Trainer Robot"
timepoint: post
scale_type: likert_7
target: trainer_robot

response_scale:
  type: likert
  min: 1
  max: 7
  anchors:
    1: "definitely not associated"
    4: "neutral"
    7: "definitely associated"

items:
  - {item_id: rosas_tr_01, index: 1,  subscale: warmth,     text: "Trainer RoSAS warmth item 1 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_02, index: 2,  subscale: warmth,     text: "Trainer RoSAS warmth item 2 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_03, index: 3,  subscale: warmth,     text: "Trainer RoSAS warmth item 3 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_04, index: 4,  subscale: warmth,     text: "Trainer RoSAS warmth item 4 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_05, index: 5,  subscale: warmth,     text: "Trainer RoSAS warmth item 5 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_06, index: 6,  subscale: warmth,     text: "Trainer RoSAS warmth item 6 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_07, index: 7,  subscale: competence, text: "Trainer RoSAS competence item 1 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_08, index: 8,  subscale: competence, text: "Trainer RoSAS competence item 2 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_09, index: 9,  subscale: competence, text: "Trainer RoSAS competence item 3 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_10, index: 10, subscale: competence, text: "Trainer RoSAS competence item 4 (placeholder; insert official adjective)"}
  - {item_id: rosas_tr_11, index: 11, subscale: competence, text: "Trainer RoSAS competence item 5 (placeholder; insert official adjective)"}
