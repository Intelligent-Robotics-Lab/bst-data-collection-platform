# Big Five Inventory-2 Short Form (BFI-2-S; Soto & John, 2017). 30 items, 5-point.
#
# RESEARCH-INTEGRITY NOTE (CLAUDE.md + requirements.md): the official BFI-2-S
# item wording is copyrighted and is NOT reproduced here. Each item has a stable
# item_id and a neutral placeholder `text`; drop the official wording into each
# `text` to run the real instrument (config edit only, no code change).
#
# The five domains (6 items each) are encoded as factual metadata in contiguous
# blocks. The official BFI-2-S interleaves items and reverse-keys several of
# them; confirm the exact item order and reverse-scoring keys against the
# published instrument when inserting the real wording. The engine does not
# score (scoring is post hoc per PRD), so this metadata is informational only.
