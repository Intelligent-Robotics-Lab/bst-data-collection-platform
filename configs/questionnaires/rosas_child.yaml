# Robotic Social Attributes Scale (RoSAS; Carpinella et al., 2017) -- CHILD
# robot. 18 items, 7-point. Three subscales (Warmth, Competence, Discomfort),
# 6 items each.
#
# COPYRIGHT / PUBLIC REPO: RoSAS items are single adjectives rated for how
# closely they are associated with the robot. The verbatim adjectives are NOT in
# this tracked config; they are loaded at render time from the GITIGNORED local
# file configs/questionnaires/local/rosas_child.items.yaml (join by item_id).
# Same 18 adjectives as rosas_trainer; the two differ only in the target agent
# (child vs trainer), carried by `target` and by the instruction in the local
# file. On a public clone with no local file, items render with empty text.
#
# SCORING (post hoc; engine does not score). No reversals. Each dimension = mean
# of its 6 items. Source order groups the items by dimension (Warmth 1-6,
# Competence 7-12, Discomfort 13-18).
questionnaire_key: rosas_child
version: "1.0.0"
title: "RoSAS - Child Robot"
timepoint: post
scale_type: likert_7
target: child_robot

response_scale:
  type: likert
  min: 1
  max: 7
  anchors:
    1: "Not at all associated"
    2: "Slightly associated"
    3: "Somewhat associated"
    4: "Moderately associated"
    5: "Very associated"
    6: "Extremely associated"
    7: "Completely associated"

scoring:
  reversals: none
  dimensions:
    warmth:     [rosas_ch_01, rosas_ch_02, rosas_ch_03, rosas_ch_04, rosas_ch_05, rosas_ch_06]
    competence: [rosas_ch_07, rosas_ch_08, rosas_ch_09, rosas_ch_10, rosas_ch_11, rosas_ch_12]
    discomfort: [rosas_ch_13, rosas_ch_14, rosas_ch_15, rosas_ch_16, rosas_ch_17, rosas_ch_18]

# Adjective text lives in the gitignored local file (by item_id).
items:
  - {item_id: rosas_ch_01, index: 1,  subscale: warmth}
  - {item_id: rosas_ch_02, index: 2,  subscale: warmth}
  - {item_id: rosas_ch_03, index: 3,  subscale: warmth}
  - {item_id: rosas_ch_04, index: 4,  subscale: warmth}
  - {item_id: rosas_ch_05, index: 5,  subscale: warmth}
  - {item_id: rosas_ch_06, index: 6,  subscale: warmth}
  - {item_id: rosas_ch_07, index: 7,  subscale: competence}
  - {item_id: rosas_ch_08, index: 8,  subscale: competence}
  - {item_id: rosas_ch_09, index: 9,  subscale: competence}
  - {item_id: rosas_ch_10, index: 10, subscale: competence}
  - {item_id: rosas_ch_11, index: 11, subscale: competence}
  - {item_id: rosas_ch_12, index: 12, subscale: competence}
  - {item_id: rosas_ch_13, index: 13, subscale: discomfort}
  - {item_id: rosas_ch_14, index: 14, subscale: discomfort}
  - {item_id: rosas_ch_15, index: 15, subscale: discomfort}
  - {item_id: rosas_ch_16, index: 16, subscale: discomfort}
  - {item_id: rosas_ch_17, index: 17, subscale: discomfort}
  - {item_id: rosas_ch_18, index: 18, subscale: discomfort}
