# Emotion Regulation Questionnaire (ERQ; Gross & John, 2003). 10 items, 7-point.
#
# RESEARCH-INTEGRITY NOTE (CLAUDE.md + requirements.md): the official ERQ item
# wording is copyrighted and is NOT reproduced here. Each item carries a stable
# item_id and a neutral placeholder `text`. To run with the real instrument,
# drop the official wording into each item's `text` field -- a config edit only,
# no code change. The standard subscale mapping (Reappraisal = items
# 1,3,5,7,8,10; Suppression = items 2,4,6,9) is encoded as factual metadata; the
# engine does not score (scoring is post hoc per PRD).
questionnaire_key: erq
version: "1.0.0"
title: "Emotion Regulation Questionnaire (ERQ)"
timepoint: pre
scale_type: likert_7

# Default response scale; applied to every item of type 'likert'.
response_scale:
  type: likert
  min: 1
  max: 7
  anchors:
    1: "strongly disagree"
    4: "neutral"
    7: "strongly agree"

items:
  - {item_id: erq_01, index: 1,  subscale: reappraisal, text: "ERQ item 1 (placeholder; insert official wording)"}
  - {item_id: erq_02, index: 2,  subscale: suppression, text: "ERQ item 2 (placeholder; insert official wording)"}
  - {item_id: erq_03, index: 3,  subscale: reappraisal, text: "ERQ item 3 (placeholder; insert official wording)"}
  - {item_id: erq_04, index: 4,  subscale: suppression, text: "ERQ item 4 (placeholder; insert official wording)"}
  - {item_id: erq_05, index: 5,  subscale: reappraisal, text: "ERQ item 5 (placeholder; insert official wording)"}
  - {item_id: erq_06, index: 6,  subscale: suppression, text: "ERQ item 6 (placeholder; insert official wording)"}
  - {item_id: erq_07, index: 7,  subscale: reappraisal, text: "ERQ item 7 (placeholder; insert official wording)"}
  - {item_id: erq_08, index: 8,  subscale: reappraisal, text: "ERQ item 8 (placeholder; insert official wording)"}
  - {item_id: erq_09, index: 9,  subscale: suppression, text: "ERQ item 9 (placeholder; insert official wording)"}
  - {item_id: erq_10, index: 10, subscale: reappraisal, text: "ERQ item 10 (placeholder; insert official wording)"}
